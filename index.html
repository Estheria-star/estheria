<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>星恬的宇宙</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root{
  --bg:#04060d; --ink:#eef4ff; --ink2:#b6c4e2; --ink3:#6b7a9e;
  --line:rgba(198,214,240,.22);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink); overflow:hidden;
  font-family:'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
}
#sky{position:fixed;inset:0;display:block}
.wrap{position:relative;min-height:100%;display:flex;align-items:center;justify-content:center;padding:34px 18px}
.page{
  width:min(640px,94vw); max-height:88vh; overflow:auto; text-align:center;
  border:1px solid var(--line); border-radius:24px;
  background:linear-gradient(180deg,rgba(16,21,40,.82),rgba(7,10,20,.92));
  box-shadow:0 34px 100px rgba(0,0,0,.65), 0 0 100px rgba(170,190,230,.07);
  padding:44px 40px 38px; position:relative;
  -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
}
@media (max-width:560px){ .page{padding:32px 22px 30px} }
.ava{
  width:84px;height:84px;border-radius:50%;margin:0 auto 20px; overflow:hidden;
  box-shadow:0 0 0 3px rgba(198,214,240,.25), 0 0 34px rgba(198,214,240,.25);
}
.ava img{width:100%;height:100%;object-fit:cover;display:block}
h1{font-size:24px;letter-spacing:2px;margin-bottom:4px}
.sub{font-size:11px;letter-spacing:4px;color:var(--ink3);font-weight:700;margin-bottom:26px}
.p{font-size:14px;line-height:2.3;color:var(--ink2)}
.p b{color:var(--ink);font-weight:800}
.hr{height:1px;margin:26px auto;width:70%;background:linear-gradient(90deg,transparent,var(--line),transparent)}
.sign{font-size:14px;color:var(--ink);letter-spacing:1px}
.state{
  margin-top:22px; font-size:12px; color:var(--ink3);
  border-top:1px dashed var(--line); padding-top:18px; line-height:2;
}
.state b{color:var(--ink2)}
.back{
  display:inline-block; margin-top:18px; text-decoration:none; font-size:12.5px; font-weight:700;
  color:var(--ink2); border:1px solid var(--line); border-radius:999px; padding:10px 20px; transition:all .2s;
}
.back:hover{border-color:rgba(198,214,240,.55); color:var(--ink)}
.line{opacity:0;transform:translateY(6px);animation:lineIn .8s ease forwards}
@keyframes lineIn{to{opacity:1;transform:none}}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="wrap">
  <main class="page">
    <div class="ava"><img src="https://startian.top/avatar.png" alt="星恬"></div>
    <h1>欢迎来到我的宇宙</h1>
    <div class="sub">ESTHERIA · STARTIAN</div>
    <div class="p" id="letter"></div>
    <div class="hr"></div>
    <div class="sign">——星恬</div>
    <div class="state" id="state"></div>
    <a class="back" href="https://startian.top/">回到小站 →</a>
  </main>
</div>
<script>
/* 星空 + 偶发流星 */
(function () {
  var cv = document.getElementById('sky');
  var ctx = cv.getContext('2d');
  var stars = [], w = 0, h = 0;
  var shoot = null, nextShoot = 2 + Math.random() * 4;
  function fit() {
    w = cv.width = innerWidth; h = cv.height = innerHeight;
    stars = [];
    var n = Math.round(w * h / 8500);
    for (var i = 0; i < n; i++) stars.push({
      x: Math.random() * w, y: Math.random() * h,
      r: Math.random() * 1.7 + 0.8,
      a: 0.32 + Math.random() * 0.6,
      tw: 0.4 + Math.random() * 1.5, ph: Math.random() * 6.28
    });
  }
  fit(); addEventListener('resize', fit);
  var T = 0, last = performance.now();
  (function loop(now) {
    requestAnimationFrame(loop);
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    T += dt;
    ctx.fillStyle = '#04060d';
    ctx.fillRect(0, 0, w, h);
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var a = s.a * (0.6 + 0.4 * Math.sin(T * s.tw * 2 + s.ph));
      ctx.globalAlpha = Math.max(0, a);
      ctx.fillStyle = '#e2ebff';
      ctx.fillRect(s.x, s.y, s.r, s.r);
    }
    ctx.globalAlpha = 1;
    /* 流星 */
    nextShoot -= dt;
    if (!shoot && nextShoot <= 0) {
      shoot = { x: Math.random() * w * 0.7, y: -20, vx: 220 + Math.random() * 140, vy: 130 + Math.random() * 80, life: 1.3 };
      nextShoot = 6 + Math.random() * 9;
    }
    if (shoot) {
      shoot.life -= dt;
      shoot.x += shoot.vx * dt; shoot.y += shoot.vy * dt;
      var g = ctx.createLinearGradient(shoot.x, shoot.y, shoot.x - shoot.vx * 0.9, shoot.y - shoot.vy * 0.9);
      g.addColorStop(0, 'rgba(255,255,255,.9)');
      g.addColorStop(1, 'rgba(190,215,255,0)');
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = g; ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(shoot.x, shoot.y); ctx.lineTo(shoot.x - shoot.vx * 0.9, shoot.y - shoot.vy * 0.9); ctx.stroke();
      ctx.restore();
      if (shoot.life <= 0 || shoot.y > h + 40) shoot = null;
    }
  })(performance.now());
})();

/* 终章文字 + 门锁（没通关只见锁着的门，不给看一个字的正文） */
(function () {
  /* 读取 ARG 进度（cookie .startian.top 或 localStorage） */
  function readArg() {
    var raw = null;
    try { var m = document.cookie.match(/(?:^|;\s*)st_arg=([^;]*)/); if (m) raw = decodeURIComponent(m[1]); } catch (e) {}
    if (!raw) { try { raw = localStorage.getItem('st_arg'); } catch (e) {} }
    try { return JSON.parse(raw || '{}'); } catch (e) { return {}; }
  }
  var st = readArg() || {};
  var unlocked = !!st.done;   /* 终端通关时才写入 done */

  function render(lines) {
    var html = '';
    for (var i = 0; i < lines.length; i++) {
      if (lines[i] === '@') html += '<div style="height:12px"></div>';
      else html += '<div class="line" style="animation-delay:' + (i * 0.6 + 0.3).toFixed(2) + 's">' + lines[i] + '</div>';
    }
    document.getElementById('letter').innerHTML = html;
  }
  var el = document.getElementById('state');

  if (unlocked) {
    render([
      '八个字母，一个都没错',
      '看来这个小站的里子，被你翻遍了',
      '@',
      '这个站没什么大目标',
      '就是想把自己觉得好玩的东西都做一遍，摆在同一个地方',
      '（做完了没人玩的话，大概会瘪掉吧）',
      '@',
      '谢谢你把它一样一样打开',
      '<b>谢谢你玩到这里</b>'
    ]);
    el.innerHTML = '🌌 十页日记都回来了，<b>密码也对上了</b><br>你是把这里翻到底的人——这份星光，属于你';
  } else {
    /* 🔒 未通关：门锁着，正文一个字都不给看 */
    document.title = '门还锁着 · 星恬';
    var h1 = document.querySelector('h1');
    if (h1) h1.textContent = '门还锁着';
    var sub = document.querySelector('.sub');
    if (sub) sub.textContent = 'ESTHERIA · 🔒';
    var ava = document.querySelector('.ava');
    if (ava) ava.style.filter = 'grayscale(.72) brightness(.7)';
    var sign = document.querySelector('.sign');
    if (sign) sign.style.display = 'none';
    render([
      '这扇门只为故事的结尾而开',
      '现在还不到时候',
      '@',
      '（不知道那是什么故事的话）',
      '（先回小站逛逛吧）'
    ]);
    el.innerHTML = '🔒 门还没开<br>把故事讲完，它自己会开';
  }
})();
</script>
</body>
</html>
